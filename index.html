<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ed">
  <meta name="description" content="A practical, private baby shopping checklist." id="metaDescription">
  <title>Luca Shopping list</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Luca List">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260808-4">
  <script src="app.js?v=20260808-4" defer></script>
</head>
<body>
  <header class="hero">
    <nav class="nav" aria-label="Main navigation" data-i18n-aria="mainNavigation">
      <span class="mini-label" data-i18n="babyEssentials">Baby essentials</span>
      <div class="language-switcher" role="group" aria-label="Choose language" data-i18n-aria="chooseLanguage">
        <button class="language-option active" type="button" data-language="en" aria-pressed="true">EN</button>
        <button class="language-option" type="button" data-language="nl" aria-pressed="false">NL</button>
      </div>
    </nav>

    <div class="hero-copy" id="top">
      <h1 data-i18n="pageHeading">Luca Shopping list</h1>
    </div>

    <section class="progress-card" aria-labelledby="progressTitle">
      <div class="progress-topline">
        <div>
          <p class="progress-label" id="progressTitle" data-i18n="overallProgress">Overall progress</p>
          <p class="progress-detail" id="progressDetail">0 of 47 items resolved</p>
        </div>
        <strong id="progressPercent">0%</strong>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Shopping progress" data-i18n-aria="shoppingProgress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="progressBar"></span>
      </div>
    </section>
  </header>

  <main>
    <section class="toolbar" aria-label="List tools" data-i18n-aria="listTools">
      <div class="filters" role="group" aria-label="Filter checklist" data-i18n-aria="filterChecklist">
        <button class="filter active" type="button" data-filter="all" data-i18n="all">All</button>
        <button class="filter" type="button" data-filter="needed" data-i18n="stillNeeded">Still needed</button>
        <button class="filter" type="button" data-filter="must" data-i18n="mustHave">Must-have</button>
        <button class="filter" type="button" data-filter="resolved" data-i18n="resolved">Resolved</button>
      </div>
    </section>

    <div class="section-heading">
      <div>
        <p class="eyebrow" data-i18n="yourChecklist">Your checklist</p>
        <h2 data-i18n="shopBySection">Shop by section</h2>
      </div>
      <button class="text-button" id="toggleSections" type="button">Collapse all</button>
    </div>

    <div id="checklist" class="checklist" aria-live="polite"></div>
    <p class="empty-state" id="emptyState" hidden data-i18n="emptyState">No matching items. Try another filter.</p>
  </main>

  <footer>
    <span class="brand"><span class="brand-mark">L</span> <span data-i18n="pageHeading">Luca Shopping list</span></span>
    <p data-i18n="footerText">Made for tiny beginnings and big days out.</p>
  </footer>

</body>
</html>
